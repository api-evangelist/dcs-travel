name: DCS-Touristik (DCS Travel)
description: >-
  DCS-Touristik GmbH, trading as DCS Travel (dcs.travel), is a German river- and
  sea-cruise operator based in Nagel, Germany. The company organizes river
  cruises on major European waterways — primarily the Danube and the Rhine — as
  well as sea cruises along the Croatian coast, operating its own vessels
  including the DCS Amethyst 1 and DCS Amethyst 2. Its business is direct
  consumer travel booking: multi-day cruise packages (roughly 3 to 12 days),
  organized transfers and shore excursions, themed sailings, travel-insurance
  partnerships, and early-booking discounts. This is a consumer-facing tourism
  brand with no public developer program, API, SDK, or developer documentation.
  It was originally added to the API Evangelist network as a venture-portfolio
  stub; that classification appears to be a false match (the "early-bird" cruise
  discount wording rather than the Earlybird venture firm), and no API surface
  was found during enrichment.
